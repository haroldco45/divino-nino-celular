<style>
:root{
  --azul:#0c2d7a; --azul2:#1747b8; --amarillo:#ffd23f; --rojo:#e5384b; --verde:#3fae49;
  --celeste:#2f8fe0; --morado:#6c3fc4; --naranja:#f26b1d; --rosa:#e6457a; --teal:#159f8e;
  --bg:#f4f6fc; --card:#ffffff; --tx:#18203a; --tx2:#4a5373; --line:#e3e7f3;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;overflow-x:hidden}
h1,h2,h3,.baloo{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.1}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Barra superior */
.top{position:sticky;top:0;z-index:50;background:rgba(12,45,122,.92);backdrop-filter:blur(8px);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px}
.brand{font-family:"Baloo 2";font-weight:800;font-size:1.05rem;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:Nunito;font-weight:600;font-size:.7rem;opacity:.8;margin-top:-4px}
.btns{display:flex;gap:6px;flex-shrink:0}
.btn{border:0;cursor:pointer;font:800 .8rem Nunito;padding:8px 12px;border-radius:999px;background:#fff;color:var(--azul);transition:transform .2s}
.btn:active{transform:scale(.95)}
.btn.alt{background:var(--amarillo)}
#progress{position:absolute;left:0;bottom:0;height:3px;background:var(--amarillo);width:0}

.marca{display:flex;align-items:center;gap:10px;min-width:0}
.mini{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex-shrink:0}
.cabeza{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.escudo{width:150px;height:150px;border-radius:50%;background:#fff;padding:8px;object-fit:contain;flex-shrink:0;
  box-shadow:0 0 0 6px rgba(255,210,63,.55),0 14px 34px rgba(0,0,0,.3);animation:latir 4s ease-in-out infinite}
@keyframes latir{50%{transform:scale(1.04);box-shadow:0 0 0 12px rgba(255,210,63,.25),0 14px 34px rgba(0,0,0,.3)}}
@media(max-width:560px){.escudo{width:112px;height:112px}}
/* Hero */
.hero{position:relative;color:#fff;overflow:hidden;padding:46px 0 70px;
  background:linear-gradient(120deg,#0c2d7a,#1747b8,#6c3fc4,#e6457a,#0c2d7a);background-size:400% 400%;animation:mover 18s ease infinite}
@keyframes mover{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.35}
.hero:before{width:320px;height:320px;background:var(--amarillo);top:-120px;right:-80px;animation:flotar 9s ease-in-out infinite}
.hero:after{width:260px;height:260px;background:#3fd0ff;bottom:-120px;left:-60px;animation:flotar 11s ease-in-out infinite reverse}
@keyframes flotar{50%{transform:translateY(30px)}}
.hero .wrap{position:relative;z-index:2}
.inst{font-weight:800;letter-spacing:2px;font-size:.85rem;opacity:.9}
.hero h1{font-size:clamp(2.4rem,8vw,4.4rem);font-weight:800;margin:4px 0 6px;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.lugar{display:inline-block;background:var(--amarillo);color:var(--azul);font-weight:800;padding:4px 16px;border-radius:999px}
.reso{font-size:.85rem;opacity:.85;margin-top:8px}
.lema{margin-top:10px;font-weight:700;letter-spacing:1px;font-size:.8rem;opacity:.85}
.circ{margin-top:24px;display:inline-flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.55);border-radius:18px;padding:12px 18px}
.circ b{font-family:"Baloo 2";font-size:1.25rem}
.circ span{background:#fff;color:var(--rosa);border-radius:999px;padding:2px 12px;font-weight:800}
.titulo{margin-top:26px;background:var(--azul);border-radius:22px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.titulo h2{font-size:clamp(1.35rem,4.6vw,2.2rem);text-transform:uppercase}
.titulo h2 em{font-style:normal;color:var(--amarillo);display:block}
.titulo p{margin-top:10px;background:#cfe6ff;color:var(--azul);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.92rem;display:inline-block}
.estado{margin-top:18px;display:flex;align-items:center;gap:10px;font-weight:700}
.pulso{width:12px;height:12px;border-radius:50%;background:#6dff8a;box-shadow:0 0 0 0 rgba(109,255,138,.8);animation:pulso 1.8s infinite;flex-shrink:0}
@keyframes pulso{70%{box-shadow:0 0 0 14px rgba(109,255,138,0)}100%{box-shadow:0 0 0 0 rgba(109,255,138,0)}}

/* Navegación por números */
.nums{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.nums::-webkit-scrollbar{display:none}
.nums a{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;font:800 1.1rem "Baloo 2";transition:transform .2s}
.nums a:hover{transform:translateY(-3px) scale(1.08)}

/* Secciones */
section.blk{margin:26px 0;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 24px rgba(20,40,100,.08);
  opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}
section.blk.ver{opacity:1;transform:none}
.cab{display:flex;align-items:center;gap:14px;padding:14px 18px;color:#fff}
.n{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 1.7rem "Baloo 2"}
.cab h3{font-size:clamp(1.25rem,4vw,1.7rem);text-transform:uppercase}
.cuerpo{padding:18px 20px 22px}
.lista{list-style:none;display:grid;gap:10px}
.lista li{position:relative;padding:12px 14px 12px 18px;border-radius:14px;background:var(--soft);border-left:5px solid var(--c);font-weight:600}
.lista li b{font-weight:800}
.dos{display:grid;gap:16px}
@media(min-width:760px){.dos{grid-template-columns:1fr 1fr}}
.panel{border-radius:18px;padding:18px;background:var(--soft)}
.panel h4{font-family:"Baloo 2";font-size:1.25rem;color:var(--c);margin-bottom:8px;text-transform:uppercase}
.nota{margin-top:12px;border:2px solid var(--c);border-radius:14px;padding:10px 14px;font-weight:700;background:#fff}
.si{margin-top:10px;padding:12px 14px;border-radius:14px;background:#e7f7e9;border-left:5px solid var(--verde);font-weight:600}
.grande{font-size:1.15rem;font-weight:700}
.sedes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sedes span{background:var(--c);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800}

/* Interactivos */
.tool{margin-top:18px;border-radius:18px;padding:18px;background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff}
.tool h4{font-family:"Baloo 2";font-size:1.2rem;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:800 .9rem Nunito;padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip.on,.chip:hover{background:var(--amarillo);border-color:var(--amarillo);color:var(--azul)}
.resp{margin-top:14px;background:#fff;color:var(--tx);border-radius:14px;padding:14px 16px;font-weight:600;min-height:52px;animation:aparecer .4s}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}}
.ruta{display:grid;gap:12px;margin-top:4px}
@media(min-width:760px){.ruta{grid-template-columns:repeat(3,1fr)}}
.paso{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden}
.paso .k{font:800 .8rem Nunito;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
.paso h4{font-family:"Baloo 2";font-size:1.3rem;margin:2px 0 8px;text-transform:uppercase}
.paso ul{padding-left:18px}
.paso li{margin:4px 0}
.paso .bg{position:absolute;right:-6px;bottom:-30px;font:800 7rem "Baloo 2";opacity:.15;line-height:1}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--soft);cursor:pointer;font-weight:600;transition:background .2s}
.check input{width:22px;height:22px;accent-color:var(--c);flex-shrink:0;margin-top:2px}
.check.ok{background:#e7f7e9;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.barra{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amarillo),var(--naranja));transition:width .5s}
.leyes{counter-reset:l}
.leyes li{counter-increment:l}
.leyes li:before{content:counter(l);position:absolute;left:-14px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:800 .85rem "Baloo 2";display:grid;place-items:center}
.leyes{padding-left:14px}
.foto{margin-top:6px}
.foto img{width:100%;border-radius:18px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.pie{background:var(--azul);color:#fff;padding:30px 0 40px;margin-top:30px;text-align:center}
.pie p{opacity:.85;font-size:.88rem;margin-top:6px}
.compartir{display:inline-block;margin-top:16px;background:var(--verde);color:#fff;text-decoration:none;font-weight:800;padding:12px 22px;border-radius:999px}
.marquee{overflow:hidden;white-space:nowrap;background:var(--amarillo);color:var(--azul);font-weight:800;padding:8px 0}
.marquee div{display:inline-block;padding-left:100%;animation:correr 28s linear infinite}
@keyframes correr{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}section.blk{opacity:1;transform:none}}
</style>
</head>

  s10e:['Continue','Modify','End'],
  s11:'The original circular',
  pie1:'Divino Niño Educational Institution · Caucasia, Antioquia',
  pie2:'Content taken from Principal\'s Circular No. 06 of 2026, dated September 24, 2026. The official version is the Spanish one.',
  pie3:'Informational app made by Vibras Positivas HM. For any questions, use the school\'s official channels.',
  share:'Share on WhatsApp',
  shareTxt:'Divino Niño School Circular No. 06 of 2026: the new rules for phones at school. '
}};

let L = 'es';
try{ L = localStorage.getItem('dn-lang') || 'es'; }catch(e){}
let compromisos = [];
try{ compromisos = JSON.parse(localStorage.getItem('dn-comp')||'[]'); }catch(e){}

const colores = ['rojo','verde','celeste','morado','naranja','rosa','teal','lima','amarillo','lila'];

function blk(n,color,titulo,html){
  return `<section class="blk" id="s${n}" style="--c:${C[color]};--soft:${SOFT[color]}">
    <div class="cab" style="background:${C[color]}"><div class="n" style="color:${C[color]}">${n}</div><h3>${titulo}</h3></div>
    <div class="cuerpo">${html}</div></section>`;
}
const li = (a,cls='lista') => `<ul class="${cls}">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;

function render(){
  const t = T[L];
  document.documentElement.lang = L;
  document.getElementById('lang').textContent = L==='es' ? 'EN' : 'ES';
  document.getElementById('install').textContent = t.install;
  document.getElementById('tCirc').textContent = t.circ+' '+t.num;

  document.getElementById('hero').innerHTML = `
    <div class="cabeza">
      <img src="logo.png" alt="Escudo I. E. Divino Niño" class="escudo">
      <div>
        <div class="inst">${t.inst}</div>
        <h1>DIVINO NIÑO</h1>
        <div class="lugar">${t.lugar}</div>
        <div class="reso">${t.reso}</div>
        <div class="lema">${t.lema}</div>
      </div>
    </div>
    <div class="circ"><b>${t.circ}</b><span>${t.num}</span><b style="font-size:1rem">${t.fecha}</b></div>
    <div class="titulo"><h2>${t.t1}<em>${t.t2}</em></h2><p>${t.sub}</p></div>
    <div class="estado"><i class="pulso"></i>${t.estado}</div>`;
  document.getElementById('marq').textContent = t.marq;

  document.getElementById('nums').innerHTML = colores.map((c,i)=>`<a href="#s${i+1}" style="background:${C[c]}">${i+1}</a>`).join('');

  const gradosBtns = t.grados.map((g,i)=>`<button class="chip" data-g="${i}">${g}</button>`).join('');
  const excBtns = t.q8o.map((o,i)=>`<button class="chip" data-e="${i}">${o}</button>`).join('');
  const checks = t.s9l.map((x,i)=>`<label class="check ${compromisos.includes(i)?'ok':''}"><input type="checkbox" data-c="${i}" ${compromisos.includes(i)?'checked':''}><span>${x}</span></label>`).join('');

  let h = '';
  h += blk(1,'rojo',t.s1, li(t.s1l));
  h += blk(2,'verde',t.s2, `<p class="grande">${t.s2t}</p><div class="sedes">${t.s2s.map(s=>`<span>${s}</span>`).join('')}</div>`);
  h += blk(3,'celeste',t.s3, li(t.s3l,'lista leyes'));
  h += blk(4,'morado',t.s4, `
    <div class="dos">
      <div class="panel" style="--c:${C.rojo};--soft:${SOFT.rojo}"><h4>${t.p1}</h4><p class="grande">${t.p1t}</p><div class="nota">${t.p1n}</div></div>
      <div class="panel" style="--c:${C.celeste};--soft:${SOFT.celeste}"><h4>${t.p2}</h4><p class="grande">${t.p2t}</p><div class="si">${t.p2s}<br>${t.p2d}</div></div>
    </div>
    <div class="tool"><h4>${t.q4}</h4><div class="chips" id="grados">${gradosBtns}</div><div class="resp" id="rGrado">${t.rIni}</div></div>`);
  h += `<h3 class="baloo" style="font-size:1.4rem;margin:30px 4px 0;color:var(--azul)">${t.ruta}</h3>`;
  h += `<div class="ruta" style="margin-top:12px">
    <div class="paso blk" id="s5" style="background:${C.naranja}"><div class="k">${t.paso} 1 · 5</div><h4>${t.s5}</h4><ul>${t.s5l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="bg">5</div></div>
    <div class="paso blk" id="s6" style="background:${C.rosa}"><div class="k">${t.paso} 2 · 6</div><h4>${t.s6}</h4><p>${t.s6t}</p><div class="bg">6</div></div>
    <div class="paso blk" id="s7" style="background:${C.teal}"><div class="k">${t.paso} 3 · 7</div><h4>${t.s7}</h4><p>${t.s7t}</p><div class="bg">7</div></div>
  </div>`;
  h += blk(8,'lima',t.s8, `<ol class="lista leyes">${t.s8l.map(x=>`<li>${x}</li>`).join('')}</ol><div class="nota">${t.s8n}</div>
    <div class="tool"><h4>${t.q8}</h4><div class="chips" id="exc">${excBtns}</div><div class="resp" id="rExc">${t.r8ini}</div></div>`);
  h += blk(9,'amarillo',t.s9, `<p style="font-weight:800;margin-bottom:6px">${t.s9c}</p>
    <div class="barra"><i id="barra"></i></div><p id="pComp" style="font-weight:700;color:var(--tx2);margin-bottom:12px"></p>
    <div style="display:grid;gap:10px">${checks}</div>`);
  h += blk(10,'lila',t.s10, `<p class="grande">${t.s10t}</p><div class="sedes">${t.s10e.map(s=>`<span>${s}</span>`).join('')}</div>`);
  h += `<section class="blk foto" id="original" style="padding:16px;background:transparent;box-shadow:none" hidden>
    <h3 class="baloo" style="font-size:1.4rem;color:var(--azul);margin-bottom:10px">${t.s11}</h3>
    <img src="circular.jpg" alt="${t.circ} ${t.num}" loading="lazy" onerror="this.closest('section').remove()" onload="this.closest('section').hidden=false"></section>`;
  document.getElementById('secciones').innerHTML = h;

  const url = location.href.split('#')[0];
  document.getElementById('pie').innerHTML = `<h3 class="baloo" style="font-size:1.3rem">${t.pie1}</h3>
    <p>${t.pie2}</p><p>${t.pie3}</p>
    <a class="compartir" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t.shareTxt+url)}">${t.share}</a>`;

  // Interacciones
  document.querySelectorAll('#grados .chip').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#grados .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const r = document.getElementById('rGrado'); r.innerHTML = (+b.dataset.g <= 5 ? t.rPri : t.rSec);
    r.style.animation='none'; r.offsetHeight; r.style.animation='';
  });
  document.querySelectorAll('#exc .chip').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#exc .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const r = document.getElementById('rExc'); r.innerHTML = (+b.dataset.e < 4 ? t.r8si : t.r8no);
    r.style.animation='none'; r.offsetHeight; r.style.animation='';
  });
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{
    const i=+c.dataset.c;
    compromisos = c.checked ? [...new Set([...compromisos,i])] : compromisos.filter(x=>x!==i);
    c.closest('label').classList.toggle('ok',c.checked);
    try{ localStorage.setItem('dn-comp',JSON.stringify(compromisos)); }catch(e){}
    progreso();
  });
  progreso();
  observar();
}
function progreso(){
  document.getElementById('barra').style.width = (compromisos.length/5*100)+'%';
  document.getElementById('pComp').textContent = T[L].s9p(compromisos.length);
}
function observar(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('ver'); io.unobserve(e.target);} }),{threshold:.12});
  document.querySelectorAll('.blk').forEach(b=>io.observe(b));
}
document.getElementById('lang').onclick=()=>{
  L = L==='es'?'en':'es';
  try{ localStorage.setItem('dn-lang',L); }catch(e){}
  render();
};
addEventListener('scroll',()=>{
  const h = document.documentElement;
  document.getElementById('progress').style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
},{passive:true});

// Instalación como app
let aviso;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); aviso=e; document.getElementById('install').hidden=false; });
document.getElementById('install').onclick=async()=>{ if(!aviso) return; aviso.prompt(); await aviso.userChoice; aviso=null; document.getElementById('install').hidden=true; };
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

render();
</script>
</body>
</html>
